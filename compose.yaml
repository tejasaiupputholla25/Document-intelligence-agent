name: document-intelligence


services:

  # =======================================================
  # POSTGRESQL + PGVECTOR
  # =======================================================

  db:
    image: pgvector/pgvector:0.8.6-pg18-bookworm

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

      - ./docker/postgres/001-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  # =======================================================
  # FASTAPI BACKEND
  # =======================================================

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: document-intelligence-app:local

    restart: unless-stopped

    init: true

    environment:

      HF_TOKEN: ${HF_TOKEN}

      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      PG_CONN_STR: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      API_BASE_URL: http://api:8000

    command:
      [
        "uvicorn",
        "app.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    ports:
      - "8000:8000"

    volumes:

      - uploads_data:/app/uploads

      - huggingface_cache:/root/.cache/huggingface

    depends_on:

      db:
        condition: service_healthy

    healthcheck:

      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
        ]

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  # =======================================================
  # STREAMLIT FRONTEND
  # =======================================================

  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    image: document-intelligence-app:local

    restart: unless-stopped

    init: true

    environment:

      API_BASE_URL: http://api:8000

    command:
      [
        "streamlit",
        "run",
        "streamlit_app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true",
        "--browser.gatherUsageStats=false"
      ]

    ports:
      - "8501:8501"

    depends_on:

      api:
        condition: service_healthy

    healthcheck:

      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 8501), 5); s.close()"
        ]

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


# =========================================================
# PERSISTENT VOLUMES
# =========================================================

volumes:

  postgres_data:
    name: document_intelligence_compose_pgdata

  uploads_data:
    name: document_intelligence_compose_uploads

  huggingface_cache:
    name: document_intelligence_hf_cache