name: Document Intelligence CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: document-intelligence-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  quality:
    name: Tests and Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HF_TOKEN: hf_ci_dummy_token_not_real

      API_BASE_URL: http://127.0.0.1:8000

      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: ci_docintel_password
      POSTGRES_DB: docintel

      DATABASE_URL: postgresql+psycopg://docintel:ci_docintel_password@localhost:5433/docintel
      PG_CONN_STR: postgresql://docintel:ci_docintel_password@localhost:5433/docintel

      TEST_DATABASE_URL: postgresql+psycopg://docintel:ci_docintel_password@localhost:5433/docintel_test
      TEST_PG_CONN_STR: postgresql://docintel:ci_docintel_password@localhost:5433/docintel_test

    services:

      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm

        env:
          POSTGRES_USER: docintel
          POSTGRES_PASSWORD: ci_docintel_password
          POSTGRES_DB: docintel

        ports:
          - 5433:5432

        options: >-
          --health-cmd "pg_isready -U docintel -d docintel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create test database
        env:
          PGPASSWORD: ci_docintel_password
        run: |
          psql \
            -h localhost \
            -p 5433 \
            -U docintel \
            -d postgres \
            -c "CREATE DATABASE docintel_test;"

      - name: Enable pgvector
        env:
          PGPASSWORD: ci_docintel_password
        run: |
          psql \
            -h localhost \
            -p 5433 \
            -U docintel \
            -d docintel \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

          psql \
            -h localhost \
            -p 5433 \
            -U docintel \
            -d docintel_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Verify databases
        env:
          PGPASSWORD: ci_docintel_password
        run: |
          psql \
            -h localhost \
            -p 5433 \
            -U docintel \
            -d docintel_test \
            -c "SELECT current_database();"

          psql \
            -h localhost \
            -p 5433 \
            -U docintel \
            -d docintel_test \
            -c "SELECT extname, extversion FROM pg_extension WHERE extname='vector';"

      - name: Check dependency consistency
        run: |
          python -m pip check

      - name: Run tests with coverage
        run: |
          python -m pytest tests \
            -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Run dependency security audit
        run: |
          pip-audit

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14


  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    needs:
      - quality

    permissions:
      contents: read
      packages: write

    env:
      HF_TOKEN: hf_ci_dummy_token_not_real

      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: ci_docintel_password
      POSTGRES_DB: docintel

      API_BASE_URL: http://127.0.0.1:8000

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose
        run: |
          docker compose config -q

      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile

          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

          provenance: true
          sbom: true